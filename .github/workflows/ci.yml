name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check release tag matches the workspace version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(f"Invalid release tag: {tag}; expected vX.Y.Z")
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match workspace version {version}")
      - name: Check formatting
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: target/ci-stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: stable
          workspaces: . -> target/ci-stable
      - name: Test all targets and compatibility fixtures (stable)
        run: cargo +stable test --workspace --all-targets --all-features --locked
      # --all-targets excludes doctests, so run them explicitly.
      - name: Test documentation examples (stable)
        run: cargo +stable test --workspace --doc --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps --locked
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
          workspaces: . -> target/msrv
      - name: Test all targets and compatibility fixtures (Rust 1.89)
        env:
          CARGO_TARGET_DIR: target/msrv
        run: cargo +1.89.0 test --workspace --all-targets --all-features --locked
      - name: Test documentation examples (Rust 1.89)
        env:
          CARGO_TARGET_DIR: target/msrv
        run: cargo +1.89.0 test --workspace --doc --all-features --locked

  package:
    name: Verify release packages
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify both crates can be published
        run: cargo publish --workspace --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The package job already unpacked and built both crates at this commit.
      - name: Publish both crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --no-verify --locked

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; preserving its notes."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "ycode $GITHUB_REF_NAME" \
              --generate-notes
          fi
