name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: target/ci-stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: stable
          workspaces: . -> target/ci-stable
      - name: Test all targets and compatibility fixtures (stable)
        run: cargo +stable test --workspace --all-targets --all-features --locked
      # --all-targets excludes doctests, so run them explicitly.
      - name: Test documentation examples (stable)
        run: cargo +stable test --workspace --doc --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps --locked
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
          workspaces: . -> target/msrv
      - name: Test all targets and compatibility fixtures (Rust 1.89)
        env:
          CARGO_TARGET_DIR: target/msrv
        run: cargo +1.89.0 test --workspace --all-targets --all-features --locked
      - name: Test documentation examples (Rust 1.89)
        env:
          CARGO_TARGET_DIR: target/msrv
        run: cargo +1.89.0 test --workspace --doc --all-features --locked
